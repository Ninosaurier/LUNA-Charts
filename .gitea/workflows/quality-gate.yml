name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [dev, main]

jobs:
  lint-and-format:
    runs-on: ubuntu-docker-dind
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: corepack enable
      - run: corepack prepare pnpm@11.11.0 --activate

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  changeset-check:
    runs-on: ubuntu-docker-dind
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: corepack enable
      - run: corepack prepare pnpm@11.11.0 --activate

      - run: pnpm install --frozen-lockfile

      - name: Verify changeset exists
        continue-on-error: true
        run: pnpm changeset status --since=origin/dev

  unit-tests:
    runs-on: ubuntu-docker-dind
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: corepack enable
      - run: corepack prepare pnpm@11.11.0 --activate

      - run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit

  component-tests:
    runs-on: ubuntu-docker-dind
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: corepack enable
      - run: corepack prepare pnpm@11.11.0 --activate

      - run: pnpm install --frozen-lockfile
      # ========================================================

      - name: Run component tests (Docker)
        run: pnpm test:component
