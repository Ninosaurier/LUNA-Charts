name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches: [dev, main]

jobs:
  lint-and-format:
    runs-on: ubuntu-docker-dind
    container:
      image: git.byting-pandas.ninja/ci/node22-docker:latest
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable
      - run: corepack prepare pnpm@11.11.0 --activate

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  changeset-check:
    runs-on: ubuntu-docker-dind
    container:
      image: git.byting-pandas.ninja/ci/node22-docker:latest
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: corepack enable
      - run: corepack prepare pnpm@11.11.0 --activate

      - run: pnpm install --frozen-lockfile

      - name: Verify changeset exists
        continue-on-error: true
        run: pnpm changeset status --since=origin/dev

  unit-tests:
    runs-on: ubuntu-docker-dind
    container:
      image: git.byting-pandas.ninja/ci/node22-docker:latest
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable
      - run: corepack prepare pnpm@11.11.0 --activate

      - run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test:unit

  component-tests:
    runs-on: ubuntu-docker-dind
    container:
      image: git.byting-pandas.ninja/ci/luna-charts-test:v1.62.1
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - run: corepack prepare pnpm@11.11.0 --activate

      - run: pnpm install --frozen-lockfile

      - name: Run component tests (Playwright)
        working-directory: packages/luna-charts
        run: pnpm test:browser